<!doctype html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/css/bootstrap.min.css"> 
  <title>周文瀚的简历</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12"></script>

  <style>
    .bg_title {
      background-color: rgb(46, 188, 174);
    }
    .text_title {
      color: rgb(46, 188, 174);
      border-color: rgb(46, 188, 174)!important;
      border-width: 2px!important;
    }
  </style>
</head>
<body>


<div id="app" style="margin-top: 2em;  margin-bottom: 2em">
  <div class="container-fluid" >
    <div class="row">
      <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
        <img src="img/profile.jpg" alt="profile" class="img-thumbnail rounded-circle">
        <div style="text-align: center">
          <img src="img/location.png" style="width: 1.5em">
          <div>China</div>
        </div>
        <hr />
        <h1 class="h3 text_title">SKILLS</h1>
        <div v-for="(skill,i) in skills">
            {{skill.title}}
            <div class="progress">
              <div class="progress-bar" v-bind:class="[skill.bg]" role="progressbar" :style="{width: skill.percent + '%'}" v-bind:aria-valuenow="skill.percent" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
        </div>

      </nav>

      <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-md-4">
        <div class="bg_title text-white" style="padding-left: 1em; padding-right: 1em">
          <h1 class="h2">周文瀚</h1>
          <div class="border-bottom">
            程序员/创新工程师
          </div>
          <div>
            {{intro}}
          </div>
        </div>

        <div style="padding-left: 1em; padding-right: 1em; margin-top: 1em">
          <div class="border-bottom text_title" style="font-size: 1.2em; font-weight: bold">
            WORK EXPERIENCE
          </div>
          <div v-for="(exp,i) in experience" style="margin-bottom: 1em">
            <span style="font-weight: bold" class="text_title">{{exp.title}}</span>
            <div>{{exp.company}}</div>
            <span class="text_title" style="font-style: italic; font-size: 0.9em">{{exp.range}}</span>
            <ul style="list-style-image:url('img/ul.png');  margin-left: -1.5em">
              <li v-for="(acc) in exp.accomplishment">{{acc}}</li>
            </ul>
          </div>
        </div>

        <div style="padding-left: 1em; padding-right: 1em; margin-top: 1em">
          <div class="border-bottom text_title" style="font-size: 1.2em; font-weight: bold">
            EDUCATION
          </div>
          <span style="font-weight: bold" class="text_title">
            Macromolecule - Bachelor’s Degree
          </span>
          <div>
            QIQIHAR UNIVERSITY
          </div>
          <span class="text_title" style="font-style: italic; font-size: 0.9em">2005-2009</span>
        </div>

        <div style="padding-left: 1em; padding-right: 1em; margin-top: 1em">
          <div class="border-bottom text_title" style="font-size: 1.2em; font-weight: bold">
            CERTIFICATION
          </div>
          <div>
            SCJP
          </div>
          <div>
            TOEFL/80

        </div>
        <div style="padding-left: 1em; padding-right: 1em; margin-top: 1em">

            <a href="http://thinkinlife.org/everything-is-meaningless/">personal blog</a>
          </div>
          <div>

          </div>
          <div>
            <a href="https://github.com/hl-a-k">Github profile</a>

    </div>
  </div>
